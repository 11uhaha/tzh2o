<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Товар</title>
</head>
<body>

<div th:if="${error}" style="color:red" th:text="${error}"></div>
<div th:if="${message}" style="color:green" th:text="${message}"></div>

<h2>Товар</h2>

<div th:if="${product}">
    <p>ID: <span th:text="${product.id}"></span></p>
    <p>Тип: <span th:text="${product.type}"></span></p>
    <p>Серийный номер: <span th:text="${product.serialNumber}"></span></p>
    <p>Производитель: <span th:text="${product.manufacturer}"></span></p>
    <p>Цена: <span th:text="${product.price}"></span></p>
    <p>Количество: <span th:text="${product.stockQuantity}"></span></p>

    <p th:if="${product.formFactor}">Форм-фактор: <span th:text="${product.formFactor}"></span></p>
    <p th:if="${product.laptopSize}">Размер: <span th:text="${product.laptopSize}"></span></p>
    <p th:if="${product.diagonal}">Диагональ: <span th:text="${product.diagonal} + 'дюймов'"></span></p>
    <p th:if="${product.capacity}">Объем: <span th:text="${product.capacity} + 'ГБ'"></span></p>

    <form method="post" action="/edit-product">
        <input type="hidden" name="id" th:value="${product.id}">
        <input type="hidden" name="type" th:value="${product.type}">
        <input type="hidden" name="serialNumber" th:value="${product.serialNumber}">
        <input type="hidden" name="manufacturer" th:value="${product.manufacturer}">
        <input type="hidden" name="stockQuantity" th:value="${product.stockQuantity}">
        <input type="hidden" name="formFactor" th:value="${product.formFactor}">
        <input type="hidden" name="laptopSize" th:value="${product.laptopSize}">
        <input type="hidden" name="diagonal" th:value="${product.diagonal}">
        <input type="hidden" name="capacity" th:value="${product.capacity}">
        Новая цена: <input type="number" step="0.01" name="price" th:value="${product.price}" required>
        <button type="submit">Обновить цену</button>
    </form>
</div>

<a href="/">Назад</a>

</body>
</html>
